# Kartaclysm WFC: postgres + wwfc + caddy. Host networking so the game's fixed TCP/UDP ports and
# real client IPs reach wwfc directly. Run via deploy/install.sh (creates deploy/.env).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: wwfc
      POSTGRES_DB: wwfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wwfc"]
      interval: 5s
      retries: 20

  wwfc:
    build: ..
    restart: unless-stopped
    network_mode: host
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_SECRET: ${API_SECRET}
      ALLOW_DOLPHIN_KEYS: ${ALLOW_DOLPHIN_KEYS:-true}
    volumes:
      - ./payload:/app/payload:ro      # output of client/build-client.sh <domain>
      - ./data/logs:/app/logs
      - ./data/state:/app/state

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - ./data/caddy:/data
